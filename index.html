<!DOCTYPE html>
<html>
<head>

<meta name="viewport" content="width=device-width, initial-scale=1">

<script src="https://unpkg.com/html5-qrcode"></script>

<style>
body{
  font-family:Arial;
  text-align:center;
  background:#111;
  color:white;
}

#reader{ width:100%; }

#status{
  font-size:28px;
  margin:20px;
}

.ok{ color:#00ff88; }
.err{ color:red; }

button{
  font-size:20px;
  padding:10px 20px;
  margin-top:10px;
}
</style>

</head>
<body>

<h1>SCANNER</h1>

<div id="status">PRONTO</div>

<button onclick="startScan()">INIZIA SCANSIONE</button>

<div id="reader" style="display:none;"></div>

<script>

const API = "https://script.google.com/macros/s/AKfycbwdflMaYs5ZfwZIYyY6FJm_xNEXGkWxF5flgZOjNRC4fFLTCXrVLpuDlxIvYi2rxgt4dQ/exec";

let scanner;
let state = "IDLE"; // IDLE | PRODOTTO | LOTTO
let lock = false;
let lastScan = "";

function beep(){
  navigator.vibrate(200);
}

async function send(url){
  const r = await fetch(url);
  return await r.text();
}

function startScan(){

  document.getElementById("reader").style.display = "block";

  scanner = new Html5Qrcode("reader");

  scanner.start(
    { facingMode: "environment" },
    { fps: 10, qrbox: 250 },
    onScan
  );

  state = "PRODOTTO";
  document.getElementById("status").innerText = "SCANSIONA PRODOTTO";
}

function onScan(decodedText){

  // 🔴 BLOCCO ASSOLUTO DUPLICATI
  if(lock) return;
  if(decodedText === lastScan) return;

  lock = true;
  lastScan = decodedText;

  beep();

  setTimeout(()=> {
    lock = false;
    lastScan = "";
  }, 1500);

  // ======================
  // PRODOTTO
  // ======================
  if(state === "PRODOTTO"){

    const parts = decodedText.split("|");

    if(parts.length < 2){
      document.getElementById("status").innerHTML =
        "<span class='err'>QR PRODOTTO NON VALIDO</span>";
      return;
    }

    const articolo = parts[0].trim();
    const trattamento = parts[1].trim();

    send(`${API}?articolo=${encodeURIComponent(articolo)}&trattamento=${encodeURIComponent(trattamento)}&device=TEL1`);

    state = "LOTTO";

    document.getElementById("status").innerHTML =
      "<span class='ok'>PRODOTTO OK<br>SCANSIONA LOTTO</span>";

    return;
  }

  // ======================
  // LOTTO
  // ======================

  let lotto = decodedText;

  try {
    const url = new URL(decodedText);
    lotto = url.searchParams.get("lotto") || decodedText;
  } catch(e){}

  lotto = lotto.trim();

  send(`${API}?lotto=${encodeURIComponent(lotto)}&device=TEL1`)
  .then(res => {

    if(res === "REGISTRAZIONE COMPLETATA"){
      document.getElementById("status").innerHTML =
        `<span class='ok'>${res}</span>`;
    } else {
      document.getElementById("status").innerHTML =
        `<span class='err'>${res}</span>`;
    }

    state = "PRODOTTO";
  });

}

</script>

</body>
</html>
