<!DOCTYPE html>
<html>
<head>

<meta name="viewport" content="width=device-width, initial-scale=1">

<script src="https://unpkg.com/html5-qrcode"></script>

<style>
body{
  font-family:Arial;
  text-align:center;
  background:#111;
  color:white;
}

#reader{ width:100%; }

#status{
  font-size:28px;
  margin:20px;
}

.ok{ color:#00ff88; }
.err{ color:red; }

button{
  font-size:20px;
  padding:10px 20px;
  margin-top:10px;
}
</style>

</head>
<body>

<h1>SCANNER</h1>

<div id="status">PRONTO</div>

<button onclick="startScan()">INIZIA SCANSIONE</button>

<div id="reader" style="display:none;"></div>

<script>

const API = "https://script.google.com/macros/s/AKfycbwdflMaYs5ZfwZIYyY6FJm_xNEXGkWxF5flgZOjNRC4fFLTCXrVLpuDlxIvYi2rxgt4dQ/exec";

let scanner;
let state = "PRODOTTO";
let lock = false;
let lastScanTime = 0; // 🔴 FIX IMPORTANTE

function beep(){
  navigator.vibrate(200);
}

async function send(url){
  const r = await fetch(url);
  return await r.text();
}

function startScan(){

  document.getElementById("reader").style.display = "block";

  scanner = new Html5Qrcode("reader");

  scanner.start(
    { facingMode: "environment" },
    { fps: 10, qrbox: 250 },
    onScan
  );

  state = "PRODOTTO";
  document.getElementById("status").innerText = "SCANSIONA PRODOTTO";
}

function onScan(decodedText){

  // 🔴 BLOCCO ANTI-DOPPIO VERO
  const now = Date.now();
  if(lock) return;
  if(now - lastScanTime < 2000) return;

  lock = true;
  lastScanTime = now;

  beep();

  scanner.pause(); // 🔴 FIX FONDAMENTALE

  (async () => {

    try {

      // ======================
      // PRODOTTO
      // ======================
      if(state === "PRODOTTO"){

        const parts = decodedText.split("|");

        if(parts.length < 2){
          document.getElementById("status").innerHTML =
            "<span class='err'>QR PRODOTTO NON VALIDO</span>";
          return;
        }

        const articolo = parts[0].trim();
        const trattamento = parts[1].trim();

        await send(`${API}?articolo=${encodeURIComponent(articolo)}&trattamento=${encodeURIComponent(trattamento)}&device=TEL1`);

        state = "LOTTO";

        document.getElementById("status").innerHTML =
          "<span class='ok'>PRODOTTO OK<br>SCANSIONA LOTTO</span>";

        return;
      }

      // ======================
      // LOTTO
      // ======================

      let lotto = decodedText;

      try {
        const url = new URL(decodedText);
        lotto = url.searchParams.get("lotto") || decodedText;
      } catch(e){}

      lotto = lotto.trim();

      const res = await send(`${API}?lotto=${encodeURIComponent(lotto)}&device=TEL1`);

      if(res === "REGISTRAZIONE COMPLETATA"){
        document.getElementById("status").innerHTML =
          `<span class='ok'>${res}</span>`;
      } else {
        document.getElementById("status").innerHTML =
          `<span class='err'>${res}</span>`;
      }

      state = "PRODOTTO";

    } finally {

      setTimeout(() => {
        lock = false;
        scanner.resume(); // 🔴 RIAVVIO CAMERA
      }, 1200);

    }

  })();

}

</script>

</body>
</html>
