<!DOCTYPE html>
<html>
<head>

<meta name="viewport" content="width=device-width, initial-scale=1">

<script src="https://unpkg.com/html5-qrcode"></script>

<style>

body{
  font-family:Arial;
  text-align:center;
  background:#111;
  color:white;
}

#reader{
  width:100%;
}

#status{
  font-size:28px;
  margin:20px;
}

.ok{
  color:#00ff88;
}

.err{
  color:red;
}

</style>

</head>
<body>

<h1>SCANNER</h1>

<div id="status">SCANSIONA PRODOTTO</div>

<div id="reader"></div>

<script>

const API = "https://script.google.com/macros/s/AKfycbz6RvbE4bypP0txnU7sZQD3BdtwKRBshVtJBrgniuR809otjE4iaJiRrF4lVVKbYNg8CQ/exec";

let currentProduct = false;
let busy = false;

function beep(){
  navigator.vibrate(200);
}

async function send(url){
  const r = await fetch(url);
  return await r.text();
}

function onScanSuccess(decodedText){

  if(busy) return;
  busy = true;

  beep();

  // =========================
  // QR PRODOTTO
  // =========================
  if(!currentProduct){

    const parts = decodedText.split("|");

    if(parts.length < 2){

      document.getElementById("status").innerHTML =
        "<span class='err'>QR PRODOTTO NON VALIDO</span>";

      busy = false;
      return;
    }

    const articolo = parts[0];
    const trattamento = parts[1];

    send(
      `${API}?articolo=${encodeURIComponent(articolo)}&trattamento=${encodeURIComponent(trattamento)}&device=TEL1`
    ).then(()=>{

      currentProduct = true;

      document.getElementById("status").innerHTML =
        `<span class='ok'>PRODOTTO OK<br>SCANSIONA LOTTO</span>`;

      busy = false;
    });

    return;
  }

  // =========================
  // QR LOTTO (FIX DEFINITIVO)
  // =========================

  let lotto = decodedText;

  try {
    const url = new URL(decodedText);
    lotto = url.searchParams.get("lotto") || decodedText;
  } catch (e) {
    lotto = decodedText;
  }

  send(
    `${API}?lotto=${encodeURIComponent(lotto)}&device=TEL1`
  ).then(res=>{

    if(res.includes("REGISTRAZIONE COMPLETATA")){
      document.getElementById("status").innerHTML =
        `<span class='ok'>${res}</span>`;
    } else {
      document.getElementById("status").innerHTML =
        `<span class='err'>${res}</span>`;
    }

    currentProduct = false;
    busy = false;
  });

}

const html5QrCode = new Html5Qrcode("reader");

html5QrCode.start(
  { facingMode: "environment" },
  {
    fps: 10,
    qrbox: 250
  },
  onScanSuccess
);

</script>

</body>
</html>
