<!DOCTYPE html>
<html>
<head>

<meta name="viewport" content="width=device-width, initial-scale=1">

<script src="https://unpkg.com/html5-qrcode"></script>

<style>
body{
  font-family: Arial;
  text-align: center;
  background: #111;
  color: white;
}

#reader{
  width: 100%;
  min-height: 350px;
  background: black;
}

#status{
  font-size: 26px;
  margin: 20px;
}

.ok{ color: #00ff88; }
.err{ color: red; }

button{
  font-size: 20px;
  padding: 12px;
  margin-top: 10px;
}
</style>

</head>

<body>

<h1>SCANNER</h1>

<div id="status">PRONTO</div>

<button onclick="startScan()">INIZIA SCANSIONE</button>

<div id="reader" style="display:none;"></div>

<script>

// 🔥 TUO DEPLOY
const API = "https://script.google.com/macros/s/AKfycbx4YpG4M08bKOryUwl2qNyAFMlS4cGep1hdyeLiIjcxydfGtC-pSJVRF7btZVs16RUHrQ/exec";

let scanner = null;
let state = "PRODOTTO";
let lock = false;
let lastScanTime = 0;

function beep(){
  navigator.vibrate(150);
}

async function send(url){
  const r = await fetch(url);
  return await r.text();
}

// ======================
// START CAMERA (FIX iPhone)
// ======================
async function startScan() {

  document.getElementById("reader").style.display = "block";
  document.getElementById("status").innerText = "AVVIO CAMERA...";

  try {

    if (scanner) {
      await scanner.clear();
      scanner = null;
    }

    scanner = new Html5Qrcode("reader");

    const devices = await Html5Qrcode.getCameras();

    if (!devices || devices.length === 0) {
      throw "NESSUNA CAMERA TROVATA";
    }

    await scanner.start(
      { deviceId: devices[0].id },
      {
        fps: 10,
        qrbox: { width: 250, height: 250 }
      },
      onScan
    );

    document.getElementById("status").innerText = "SCANSIONA";

  } catch (err) {

    console.error(err);

    document.getElementById("status").innerHTML =
      "<span class='err'>CAMERA NON ATTIVA: " + err + "</span>";

  }
}

// ======================
// SCAN LOGIC
// ======================
function onScan(decodedText){

  const now = Date.now();
  if(lock) return;
  if(now - lastScanTime < 3000) return;

  lock = true;
  lastScanTime = now;

  beep();

  (async () => {

    try {

      // PRODOTTO
      if(state === "PRODOTTO"){

        const parts = decodedText.split("|");

        if(parts.length < 2){
          document.getElementById("status").innerHTML =
            "<span class='err'>QR PRODOTTO NON VALIDO</span>";
          return;
        }

        const articolo = parts[0].trim();
        const trattamento = parts[1].trim();

        await send(`${API}?articolo=${encodeURIComponent(articolo)}&trattamento=${encodeURIComponent(trattamento)}&device=TEL1`);

        state = "LOTTO";

        document.getElementById("status").innerHTML =
          "<span class='ok'>PRODOTTO OK<br>SCANSIONA LOTTO</span>";

      }

      // LOTTO
      else {

        let lotto = decodedText;

        try {
          const url = new URL(decodedText);
          lotto = url.searchParams.get("lotto") || decodedText;
        } catch(e){}

        lotto = lotto.trim();

        const res = await send(`${API}?lotto=${encodeURIComponent(lotto)}&device=TEL1`);

        if(res === "REGISTRAZIONE COMPLETATA"){
          document.getElementById("status").innerHTML =
            "<span class='ok'>" + res + "</span>";
        } else {
          document.getElementById("status").innerHTML =
            "<span class='err'>" + res + "</span>";
        }

        state = "PRODOTTO";
      }

    } finally {

      lock = false;

    }

  })();

}

</script>

</body>
</html>
