<!DOCTYPE html>
<html>
<head>

<meta name="viewport" content="width=device-width, initial-scale=1">

<script src="https://unpkg.com/html5-qrcode"></script>

<style>
body{
  font-family:Arial;
  text-align:center;
  background:#111;
  color:white;
}

#reader{
  width:100%;
  min-height:350px;
  background:black;
}

#status{
  font-size:28px;
  margin:20px;
}

.ok{ color:#00ff88; }
.err{ color:red; }

button{
  font-size:20px;
  padding:10px 20px;
  margin-top:10px;
}
</style>

</head>
<body>

<h1>SCANNER</h1>

<div id="status">PRONTO</div>

<button onclick="startScan()">INIZIA SCANSIONE</button>

<div id="reader" style="display:none;"></div>

<script>

// 🔥 INSERISCI IL TUO DEPLOY QUI
const API = "https://script.google.com/macros/s/AKfycbztPEDH-ZUjD46uW11p-cQjV37J4YIOi3nihPIVbQEV_YS2f1bY-NzzLNOIyN3TjGMFBg/exec";

let scanner = null;
let state = "PRODOTTO";
let lock = false;
let lastScanTime = 0;

function beep(){
  navigator.vibrate(200);
}

async function send(url){
  const r = await fetch(url);
  return await r.text();
}

// ======================
// START CAMERA (FIX iOS)
// ======================
async function startScan() {

  document.getElementById("reader").style.display = "block";
  document.getElementById("status").innerText = "AVVIO CAMERA...";

  try {

    if (scanner) {
      await scanner.clear();
      scanner = null;
    }

    scanner = new Html5Qrcode("reader");

    await scanner.start(
      { facingMode: "environment" },
      {
        fps: 10,
        qrbox: { width: 250, height: 250 }
      },
      onScan
    );

    document.getElementById("status").innerText = "SCANSIONA";

  } catch (err) {

    console.error(err);

    document.getElementById("status").innerHTML =
      "<span class='err'>CAMERA BLOCCATA: " + err + "</span>";

  }
}

// ======================
// SCAN HANDLER
// ======================
function onScan(decodedText){

  const now = Date.now();
  if(lock) return;
  if(now - lastScanTime < 3500) return;

  lock = true;
  lastScanTime = now;

  beep();

  (async () => {

    try {

      // ======================
      // PRODOTTO
      // ======================
      if(state === "PRODOTTO"){

        const parts = decodedText.split("|");

        if(parts.length < 2){
          document.getElementById("status").innerHTML =
            "<span class='err'>QR PRODOTTO NON VALIDO</span>";
          return;
        }

        const articolo = parts[0].trim();
        const trattamento = parts[1].trim();

        await send(`${API}?articolo=${encodeURIComponent(articolo)}&trattamento=${encodeURIComponent(trattamento)}&device=TEL1`);

        state = "LOTTO";

        document.getElementById("status").innerHTML =
          "<span class='ok'>PRODOTTO OK<br>SCANSIONA LOTTO</span>";

      }

      // ======================
      // LOTTO
      // ======================
      else {

        let lotto = decodedText;

        try {
          const url = new URL(decodedText);
          lotto = url.searchParams.get("lotto") || decodedText;
        } catch(e){}

        lotto = lotto.trim();

        const res = await send(`${API}?lotto=${encodeURIComponent(lotto)}&device=TEL1`);

        if(res === "REGISTRAZIONE COMPLETATA"){
          document.getElementById("status").innerHTML =
            `<span class='ok'>${res}</span>`;
        } else {
          document.getElementById("status").innerHTML =
            `<span class='err'>${res}</span>`;
        }

        state = "PRODOTTO";
      }

    } finally {

      lock = false;

    }

  })();

}

</script>

</body>
</html>
