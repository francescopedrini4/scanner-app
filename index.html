<!DOCTYPE html>
<html>
<head>

<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="https://unpkg.com/html5-qrcode"></script>

<style>
body{
  font-family: Arial;
  text-align: center;
  background: #111;
  color: white;
}

#reader{
  width: 100%;
  min-height: 350px;
  background: black;
}

#status{
  font-size: 26px;
  margin: 20px;
}

button{
  font-size: 20px;
  padding: 12px;
}
</style>

</head>

<body>

<h1>SCANNER</h1>

<button onclick="startScan()">INIZIA SCANSIONE</button>

<div id="status">PRONTO</div>
<div id="reader"></div>

<script>

let scanner;

async function startScan() {

  document.getElementById("status").innerText = "AVVIO CAMERA...";

  try {

    scanner = new Html5Qrcode("reader");

    const devices = await Html5Qrcode.getCameras();

    if (!devices || devices.length === 0) {
      throw "NESSUNA CAMERA TROVATA";
    }

    await scanner.start(
      { deviceId: devices[0].id },
      { fps: 10, qrbox: 250 },
      (text) => {
        document.getElementById("status").innerText = text;
      }
    );

    document.getElementById("status").innerText = "SCANSIONE ATTIVA";

  } catch (err) {

    document.getElementById("status").innerText =
      "CAMERA NON ATTIVA: " + err;

  }
}

</script>

</body>
</html>
